<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <style>
        body {
          font-family: Arial;
          background-color: #f2f2f2;
          padding: 40px;
        }

        .form-container {
          background-color: white;
          padding: 20px;
          border-radius: 8px;
          max-width: 400px;
          margin: auto;
          box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        input[type="text"], input[type="password"], input[type="email"] {
          width: 100%;
          padding: 12px;
          margin: 8px 0;
          box-sizing: border-box;
        }

        button {
          background-color: #2196F3;
          color: white;
          padding: 12px;
          width: 100%;
          border: none;
          border-radius: 4px;
          cursor: pointer;
        }

        button:hover {
          background-color: #1e88e5;
        }

        .message {
          margin-top: 10px;
          font-weight: bold;
        }
    </style>
</head>
<body>
<div class="form-container">
    <h2>Sign Up</h2>
    <form id="signupForm">
        <label for="name">Nome Completo</label>
        <input type="text" id="name" required>

        <label for="username">Username</label>
        <input type="text" id="username" required>

        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="phone">Telefone</label>
        <input type="text" id="phone" required>

        <label for="profile">Perfil da Conta</label>
        <select id="profile" required>
            <option value="public">Público</option>
            <option value="private">Privado</option>
        </select>

        <label for="password">Password</label>
        <input type="password" id="password" required>

        <label for="confirmation">Confirmar Password</label>
        <input type="password" id="confirmation" required>

        <button type="submit">Registar</button>
    </form>
    <div class="message" id="message"></div>
    <p style="text-align: center; margin-top: 15px;">
        Already have an account?
        <a href="login.html" style="color: #2196F3; text-decoration: none;">Log in here</a>
    </p>

</div>

<script>
    const form = document.getElementById("signupForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const name = document.getElementById("name").value;
        const username = document.getElementById("username").value;
        const email = document.getElementById("email").value;
        const phone = document.getElementById("phone").value;
        const profile = document.getElementById("profile").value;
        const password = document.getElementById("password").value;
        const confirmation = document.getElementById("confirmation").value;

        if (password !== confirmation) {
            message.style.color = "red";
            message.textContent = "As palavras-passe não coincidem.";
            return;
        }

        const response = await fetch("/rest/register/v4", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, name, email, phone, profile, password, confirmation })
        });

        if (response.ok) {
            message.style.color = "green";
            message.textContent = "Utilizador registado com sucesso! 🎉 A redirecionar para login...";


            setTimeout(() => {
                window.location.href = "login.html";
            }, 2000);
        } else {
            const error = await response.text();
            message.style.color = "red";
            message.textContent = "Erro: " + error;
        }
    });
</script>
</body>
</html>
